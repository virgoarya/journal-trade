appId: com.huntertrades.app
productName: Hunter Trades
copyright: Copyright © 2026 Hunter Trades

directories:
  output: dist-build
  buildResources: assets

publish:
  provider: github
  owner: virgoarya
  repo: journal-trade
  releaseType: draft

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  icon: assets/icon.ico
  signExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hunter Trades
  installerSidebar: null
  license: null
  warningsAsErrors: false

files:
  - main.js
  - preload.js
  - assets/**/*
  - node_modules/**/*

extraResources:
  - from: ../server/dist
    to: server/dist
  - from: ../server/package.json
    to: server/package.json
  - from: ../server/.env
    to: server/.env

compression: store