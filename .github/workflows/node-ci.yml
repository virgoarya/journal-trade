name: Node.js CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: testpass
        options: >-
          --health-cmd mongo --health-interval 10s --health-timeout 5s --health-retries 3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm run test
        timeout-minutes: 10

      - name: Upload test coverage (if coverage provider available)
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run linter (if configured)
        run: |
          if [ -f "eslint.config.mjs" ] || [ -f ".eslintrc.js" ]; then
            npm run lint || echo "ESLint not configured, skipping"
          else
            echo "No ESLint configured, skipping"
          fi

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node.js Security Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Dependency Vulnerability Check
        run: |
          # Verify no hardcoded secrets
          if grep -r --include="*.ts" --include="*.js" --include=".env*" "process.env\.[A-Z_]*SECRET\|process.env\.[A-Z_]*API_KEY" . && \
             ! grep -r --include="*.ts" --include="*.js" --include=".env*" "process.env\.[A-Z_]*SECRET.*=.*['\"]\|process.env\.[A-Z_]*API_KEY.*=.*['\"]" .; then
            echo "⚠️  Potential hardcoded secrets detected"
            exit 1
          fi

      - name: Auth bypass verification
        run: |
          if grep -r "x-integration-test" server/src/middleware/auth.ts | grep -v "NODE_ENV === \"test\""; then
            echo "❌ Auth bypass bypass still active in non-test environments"
            exit 1
          fi

      - name: Validation consolidation verification
        run: |
          if [ -f "server/src/middleware/validate.ts" ]; then
            echo "❌ Legacy validate.ts still exists"
            exit 1
          fi